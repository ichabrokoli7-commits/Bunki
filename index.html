<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<meta name="application-name" content="Bunki">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bunki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Bunki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--ink:#111111;--evergreen:#111111;--lime:#ffd84d;--yellow:#ffd84d;--purple:#a78bfa;--pink:#ff719a;--green:#a7f176;--blue:#7ad3ff;--red:#e5484d;--beige:#fff3c4;--muted:#6a645b;--field:#f5f2ec;--hd:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:440px;margin:0 auto;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 18px 70px}

/* neo-brutal primitives */
.ib{width:48px;height:48px;flex:0 0 48px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 4px 0 var(--ink);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.ib.y{background:var(--yellow)}
.ib:active,.plus:active,.save:active,.col:active .cbody,.btn:active,.open:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.bar{display:flex;gap:12px;align-items:center}
.sp{flex:1}

/* home */
.hero{font-family:var(--hd);font-weight:800;font-size:54px;line-height:1.02;letter-spacing:-.045em;margin:34px 0 0}
.quick{display:flex;gap:12px;margin-top:28px}
.qin{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:62px;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:3px 4px 0 var(--ink);padding:0 14px}
.qin>b{font-family:var(--hd);font-size:26px;font-weight:800}
.qin input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px}
.qin input::placeholder{color:#9a9a9a}
.qin button{color:#222;display:grid;place-items:center}
.plus{width:62px;height:62px;flex:0 0 62px;border:3px solid var(--ink);border-radius:16px;background:var(--yellow);box-shadow:3px 4px 0 var(--ink);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
h3.sec{font-family:var(--hd);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:40px 0 14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;padding-right:4px}
.col{position:relative;margin-top:30px;display:block;width:100%}
.col .tab{position:absolute;left:12px;top:-20px;width:96px;height:30px;background:var(--c);border:3px solid var(--ink);border-bottom:0;border-radius:12px 20px 0 0}
.cbody{position:relative;z-index:1;min-height:136px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 6px 0 var(--ink);padding:12px;display:flex;flex-direction:column;transition:transform .08s,box-shadow .08s}
.crow{display:flex;gap:12px;align-items:flex-start}
.cico{width:46px;height:46px;border:2px solid var(--ink);border-radius:10px;background:var(--c);display:grid;place-items:center;color:var(--ink)}
.cnt{font-size:14px;color:var(--muted);margin-top:2px}
.cname{margin-top:auto;font-family:var(--hd);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;word-break:break-word}

/* collection screen */
.ttl{flex:1;text-align:center;min-width:0}
.ttl h2{margin:0;font-family:var(--hd);font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl small{color:var(--muted);font-size:14px}
.saves-h{font-family:var(--hd);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:30px 0 16px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 26px;padding-right:4px}
.save{display:flex;flex-direction:column;width:100%;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 5px 0 var(--ink);overflow:hidden;transition:transform .08s,box-shadow .08s}
.thumb{position:relative;aspect-ratio:1.78;background:var(--yellow);border-bottom:3px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.thumb .letter{font-family:var(--hd);font-size:44px;font-weight:800}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.sb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-height:92px}
.sb b{font-family:var(--hd);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.src{display:flex;align-items:center;gap:7px;color:#555;font-size:14px;min-width:0;margin-top:auto}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{width:18px;height:18px;border-radius:50%;background:#d4d4d4;flex:0 0 18px;overflow:hidden;display:inline-block}
.fav img{width:100%;height:100%;object-fit:cover;display:block}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px;line-height:1.6}

/* search */
.sin{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:48px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 4px 0 var(--ink);padding:0 12px}
.sin input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}

/* sheets */
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(10,15,13,.5);align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sheet{width:100%;max-width:440px;max-height:94vh;overflow:auto;background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:4px 6px 0 var(--ink);margin:0 14px calc(14px + env(safe-area-inset-bottom));padding:22px 20px 24px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--hd);font-weight:700;font-size:16px;margin-bottom:8px}
.brand .fav{width:30px;height:30px;flex-basis:30px}
.trow{display:flex;gap:14px;align-items:flex-start}
.trow h2{flex:1;margin:0;font-family:var(--hd);font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15;word-break:break-word}
.meta{display:flex;align-items:center;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;padding:6px 12px 6px 9px;font-family:var(--hd);font-weight:700;font-size:17px;background:#fff}
.chip i{width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;background:var(--c);display:block}
.date{color:var(--muted);font-size:15px}
.open{display:flex;align-items:center;gap:10px;background:var(--yellow);border:3px solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);padding:10px 12px;transition:transform .08s,box-shadow .08s}
.open div{flex:1;min-width:0}
.open b{display:block;font-family:var(--hd);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.open small{display:block;font-size:14px;font-weight:500;color:#5b4a12;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.circ{width:56px;height:56px;flex:0 0 56px;border-radius:50%;background:#111;color:var(--yellow);display:grid;place-items:center}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;border:3px solid var(--ink);border-radius:14px;box-shadow:3px 4px 0 var(--ink);overflow:hidden;background:#fff}
.acts4 button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 9px;font-family:var(--hd);font-weight:700;font-size:13px;border-left:3px solid var(--ink);text-align:center}
.acts4 button:first-child{border-left:0}
.acts4 button:active{background:#f1f1f1}
.acts4 .del{color:var(--red)}
.acts4 svg{width:22px;height:22px}
.lab{font-family:var(--hd);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:20px 0 8px}
.desc{font-size:15px;line-height:1.5;color:#2a2823;margin:0}
.desc.none{color:#999}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;padding:7px 13px;font-family:var(--hd);font-weight:700;font-size:18px;background:#fff;box-shadow:2px 3px 0 var(--ink)}
.tag.add{color:#555}
.tag .rm{display:grid;place-items:center;color:#777;margin-right:-4px}
.notes{width:100%;min-height:90px;resize:none;background:#fff3c4;border:3px solid var(--ink);border-radius:14px;box-shadow:3px 4px 0 var(--ink);padding:12px 14px;font-size:15px;line-height:1.6;outline:0;display:block;overflow:hidden}
.notes::placeholder{color:#a79a78}
.sheet h4{font-family:var(--hd);font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 16px}
.sheet p.t{margin:0 0 18px;font-size:16px;line-height:1.55;color:#333}
.field{width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--field);padding:14px 16px;font-size:17px;outline:0}
.field:focus{background:#fff;box-shadow:3px 4px 0 var(--ink)}
.row{display:flex;gap:12px;margin-top:20px}
.btn{flex:1;display:grid;place-items:center;text-align:center;height:54px;border:3px solid var(--ink);border-radius:999px;background:#fff;box-shadow:3px 4px 0 var(--ink);font-family:var(--hd);font-weight:700;font-size:18px;transition:transform .08s,box-shadow .08s}
.btn.y{background:var(--yellow)}
.btn.r{background:var(--red);color:#fff}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 12px;box-shadow:2px 3px 0 var(--ink);font-family:var(--hd);font-weight:700;font-size:19px;width:100%}
.item .cico{width:36px;height:36px;border-radius:8px}
.item .sp{flex:1}
.item .ck{color:#1d6b48}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:42px;height:42px;border:3px solid var(--ink);border-radius:12px;background:var(--c);display:grid;place-items:center}
.sw button.on{box-shadow:3px 4px 0 var(--ink);transform:translate(-1px,-1px)}
.sw.ic button{background:#fff}
.sw.ic button.on{background:var(--yellow)}
.small-l{font-family:var(--hd);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 10px;display:block}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:40;font-size:15px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 28px)}
#toast.act span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast button{color:var(--yellow);font-family:var(--hd);font-weight:800;font-size:15px;padding:4px 2px;white-space:nowrap}
@media (min-width:600px){#app{padding-top:40px}}

.col{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#press{position:fixed;inset:0;z-index:30;display:none;background:rgba(10,15,13,.9)}
#press.on{display:block;animation:fade .15s}
@keyframes fade{from{opacity:0}}
#press .col{position:fixed;margin:0;pointer-events:none;transform:rotate(3deg) scale(1.04);animation:pop .22s var(--pe,cubic-bezier(.34,1.56,.64,1))}
@keyframes pop{from{transform:rotate(0) scale(1)}}
.pb{position:fixed;width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:3px 4px 0 var(--ink);display:grid;place-items:center;animation:pop2 .26s cubic-bezier(.34,1.56,.64,1) both}
.pb.del{color:var(--red)}
.pb:nth-of-type(2){animation-delay:.04s}.pb:nth-of-type(3){animation-delay:.08s}
@keyframes pop2{from{transform:scale(.2);opacity:0}}
.sheet.bs{margin:0;border-radius:34px 34px 0 0;padding:12px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:none}
.grab{width:54px;height:6px;border-radius:9px;background:var(--ink);margin:0 auto 14px}
.bs .hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.bs .hrow h4{margin:0}
.xb{width:40px;height:40px;border:2px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center}
.nl{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
.nl span:first-child{font-family:var(--hd);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.nl .cn{color:var(--muted);font-size:15px}
.sw8{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw8 button{aspect-ratio:1;min-width:0;border:2px solid var(--ink);border-radius:9px;background:var(--c);display:grid;place-items:center;transition:transform .08s}
.sw8 button.on{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.sw8.ic button{background:var(--field);color:var(--ink)}
.sw8.ic button.on{background:var(--sel);color:var(--selink)}
.bs .lab2{font-family:var(--hd);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:22px 0 10px}
.bs .big{width:100%;height:60px;margin-top:22px;border:3px solid var(--ink);border-radius:999px;background:var(--lime);box-shadow:3px 5px 0 var(--ink);font-family:var(--hd);font-weight:700;font-size:21px;text-align:center;display:grid;place-items:center}
.bs .big:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.bs .dl{display:block;width:100%;text-align:center;color:var(--red);font-family:var(--hd);font-weight:700;font-size:17px;margin-top:14px;padding:8px}

/* detail page */
.mlist{display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;margin-top:6px}
.mrow{display:flex;align-items:center;gap:14px;padding:16px 18px;font-family:var(--hd);font-weight:700;font-size:18px;text-align:left;width:100%;border-top:3px solid var(--ink)}
.mrow:first-child{border-top:0}
.mrow:active{background:#f1f1f1}
.mrow svg{flex:0 0 auto}
.mrow span:not(.pro){flex:1}
.pro{font-size:11px;letter-spacing:.08em;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:2px 8px;font-family:var(--hd)}
.ne-t{font-family:var(--hd);font-size:22px;color:var(--ink)}
.empty .ne-b svg{display:block;flex:none;margin:0}
.ne-b span{line-height:1;display:block}
.save{position:relative}
.selmark{position:absolute;top:8px;left:8px;z-index:3;width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center}
.save.sel .selmark{background:var(--yellow)}
.save.sel{box-shadow:0 0 0 4px var(--yellow),3px 5px 0 4px var(--ink)}
.selbar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:30}
.btn.r{background:var(--red);color:#fff}
.ne-b{margin-top:14px;flex:none;display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 20px;width:auto}
.hero-img{position:relative;margin:calc(-20px - env(safe-area-inset-top)) -18px 0;height:180px;background:var(--c,var(--lime));border-bottom:3px solid var(--ink);overflow:hidden;display:grid;place-items:center}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.hero-img .letter{font-family:var(--hd);font-size:72px;font-weight:700}
.hero-img .bar{position:absolute;left:18px;right:18px;top:calc(20px + env(safe-area-inset-top));z-index:2}
.dcard{position:relative;z-index:1;margin-top:-18px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:3px 5px 0 var(--ink);padding:16px 16px 20px}
.ld::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:sh 1.1s infinite;pointer-events:none}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.badge{position:absolute;left:10px;bottom:10px;padding:5px 12px;border-radius:10px;font-family:var(--hd);font-weight:700;font-size:15px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--c);color:var(--bc);opacity:.94}
.pinmark{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;background:var(--lime);border:2px solid var(--ink);display:grid;place-items:center;z-index:1}
/* search */
.cancel{flex:0 0 auto;height:48px;padding:0 16px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 4px 0 var(--ink);font-family:var(--hd);font-weight:700;font-size:19px}
.lib{margin-top:22px;background:var(--lime);border:3px solid var(--ink);border-radius:20px;box-shadow:4px 6px 0 var(--ink);padding:16px 14px 12px}
.lib-h{display:flex;justify-content:space-between;align-items:center;min-height:36px;padding:0 4px}
.lib-h b{font-family:var(--hd);font-size:21px;letter-spacing:-.01em;text-transform:uppercase}
.ovw{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:6px 12px;font-family:var(--hd);font-weight:700;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:12px;position:relative;text-align:center}
.stat+.stat::before{content:'';position:absolute;left:0;top:24%;height:52%;width:2px;background:rgba(10,15,13,.28)}
.stat.on{background:rgba(255,255,255,.45)}
.stat.on::before,.stat.on+.stat::before{display:none}
.stat b{font-family:var(--hd);font-size:40px;font-weight:700;line-height:1.1}
.stat span{font-weight:600;font-size:14px}
.sec2{display:flex;align-items:center;gap:10px;font-family:var(--hd);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;margin:32px 0 16px}
.rail{display:flex;gap:20px;overflow-x:auto;padding:2px 8px 16px 2px;margin-right:-18px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .save{flex:0 0 min(46%,190px);width:auto;scroll-snap-align:start}
.rows{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.row-i{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 5px 0 var(--ink);padding:14px}
.row-i .cico{width:48px;height:48px;flex:0 0 48px}
.row-i b{display:block;font-family:var(--hd);font-size:21px;font-weight:700;letter-spacing:-.01em}
.row-i small{color:var(--muted);font-size:15px}
.kinds{display:flex;gap:10px;margin:26px 0 22px;flex-wrap:wrap}
.kind{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:#fff;border:2px solid var(--ink);font-family:var(--hd);font-weight:700;font-size:17px}
.kind.on{background:var(--lime)}
.ph{text-align:center;color:#a39e94;padding:34px 0 20px;font-family:var(--hd);font-weight:600;font-size:22px}
.ph svg{display:block;margin:0 auto 16px;color:var(--ink)}

/* settings */
.slab{font-family:var(--hd);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:30px 0 14px}
.srow{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 5px 0 var(--ink);padding:14px 16px;margin-bottom:16px;text-align:left;transition:transform .08s,box-shadow .08s}
.srow:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.srow:disabled{opacity:.5;box-shadow:3px 5px 0 #8a918c;border-color:#8a918c;cursor:default}
.srow:disabled:active{transform:none;box-shadow:3px 5px 0 #8a918c}
.sico{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:var(--field);display:grid;place-items:center}
.stx{flex:1;min-width:0}
.stx b{display:block;font-family:var(--hd);font-size:20px;font-weight:700;letter-spacing:-.01em}
.stx small{display:block;color:var(--muted);font-size:15px;line-height:1.35;margin-top:2px}
.sright{color:#6b6b6b;display:grid;place-items:center}
.tg{width:48px;height:28px;border-radius:99px;background:#cfd3cf;position:relative;display:block;transition:background .18s}
.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .18s}
.tg.on{background:#46c37b}.tg.on i{left:23px}
.srow.red .stx b{color:var(--red)}.srow.red .sico{background:#fbe7e3;color:var(--red)}
.sfoot{text-align:center;color:var(--muted);font-size:14px;margin:26px 0 0}
.remind{display:flex;align-items:center;gap:12px;width:100%;margin-top:26px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 5px 0 var(--ink);padding:12px 14px;text-align:left}
.remind .stx b{font-size:18px}
.hw{border:3px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--field)}
.hw b{display:block;font-family:var(--hd);font-size:18px;margin-bottom:3px}
.hw span{font-size:15px;line-height:1.5;color:#4a453d}
.pv{font-size:15.5px;line-height:1.6;color:#3a362f;margin:0 0 14px}

.sech{display:flex;align-items:baseline;justify-content:space-between}
.seeall{font-weight:600;font-size:15px;color:#4a453d;text-decoration:underline;text-underline-offset:3px}
.brandfoot{text-align:center;margin-top:34px}
.brandfoot .wm{font-weight:800;font-size:44px;letter-spacing:-.05em;line-height:1;margin-top:6px}
.brandfoot .tl{font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
.empty svg{display:block;margin:0 auto 14px}

/* ---------- metadata (auto thumbnail + description) ---------- */
function ytThumb(u){
  try{const x=new URL(u),h=x.hostname.replace(/^(www|m)\./,'');let id='';
    if(h==='youtu.be')id=x.pathname.slice(1);
    else if(h==='youtube.com')id=x.searchParams.get('v')||((x.pathname.match(/\/(shorts|embed)\/([\w-]{6,})/)||[])[2]||'');
    return id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'';
  }catch(e){return''}
}
const isImg=s=>/\.(png|jpe?g|gif|webp|avif|svg)(\?|#|$)/i.test(s.url);
async function getJSON(url,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||9000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)return null;return await r.json()}catch(e){return null}finally{clearTimeout(t)}
}
async function fetchMeta(url){
  let m=null;
  const j=await getJSON('https://api.microlink.io/?url='+encodeURIComponent(url));
  if(j&&j.status==='success'){const d=j.data||{};m={title:d.title||'',desc:d.description||'',image:(d.image&&d.image.url)||'',logo:(d.logo&&d.logo.url)||'',site:d.publisher||''}}
  if(!m||(!m.title&&!m.desc)){            // second source if the first one failed
    const j2=await getJSON('https://api.dub.co/metatags?url='+encodeURIComponent(url));
    if(j2&&(j2.title||j2.description||j2.image))m={title:j2.title||'',desc:j2.description||'',image:j2.image||(m&&m.image)||'',logo:(m&&m.logo)||'',site:(m&&m.site)||''};
  }
  if(m&&!m.image)m.image=ytThumb(url);
  if(m&&!m.image&&(m.title||m.desc)){      // last resort: a screenshot of the page
    const j3=await getJSON('https://api.microlink.io/?url='+encodeURIComponent(url)+'&screenshot=true&meta=false',16000);
    if(j3&&j3.status==='success'&&j3.data&&j3.data.screenshot)m.image=j3.data.screenshot.url||'';
  }
  return m;
}
function applyMeta(s,m,force){
  if(!m)return false;
  if(m.title&&(force||!s.titleEdited))s.title=m.title.slice(0,150);
  if(m.desc)s.desc=m.desc.slice(0,400);
  if(m.image)s.image=m.image;
  if(m.logo)s.logo=m.logo;
  if(m.site)s.site=m.site;
  return !!(m.title||m.desc||m.image);
}
function softRender(){
  const a=document.activeElement;
  if(a&&a.id==='sq'&&view.name==='search'){const b=document.getElementById('sbody');if(b){const r=b.querySelector('.rail'),x=r?r.scrollLeft:0;b.innerHTML=searchBody();const r2=b.querySelector('.rail');if(r2)r2.scrollLeft=x}return}
  if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;
  render();
}
async function loadMeta(s){
  if(metaBusy.has(s.id))return;
  metaBusy.add(s.id);softRender();
  const m=await fetchMeta(s.url);
  s.metaTried=Date.now();applyMeta(s,m,false);
  metaBusy.delete(s.id);save();softRender();
  return !!m;
}
// fetch what's missing for the saves on screen (3 at a time)
async function ensureMeta(list){
  const todo=list.filter(s=>!metaBusy.has(s.id)&&(!s.image||!s.desc)&&(!s.metaTried||Date.now()-s.metaTried>6e5)).slice(0,18);
  let i=0;const worker=async()=>{while(i<todo.length)await loadMeta(todo[i++])};
  await Promise.all([worker(),worker(),worker()]);
}
function visibleSaves(){
  if(view.name==='col')return db.saves.filter(s=>s.col===view.id);
  if(view.name==='save'){const s=saveOf(view.id);return s?[s]:[]}
  if(view.name==='search')return db.saves.slice().sort((a,b)=>b.created-a.created).slice(0,24);
  return [];
}
const kick=()=>ensureMeta(visibleSaves());
function go(v){sel=null;stack.push(view);view=v;render();scrollTo(0,0);kick()}
function back(){sel=null;view=stack.pop()||{name:'home'};render();scrollTo(0,0);kick()}
function addSave(url,col){
  const h=hostOf(url);
  const s={id:uid(),url,title:h,desc:'',image:ytThumb(url),logo:'',site:siteName(h),col:col||'unsorted',notes:'',tags:[],pinned:false,seen:false,created:Date.now()};
  db.saves.push(s);save();render();
  loadMeta(s);
  return s;
}

function colCard(c){

  <div class="cbody"><div class="crow"><span class="cico" style="color:${inkOn(c.color)}">${ic(c.icon,24)}</span><span class="cnt">${countOf(c.id)} ${countOf(c.id)===1?'item':'items'}</span></div>
  <span class="cname">${esc(c.name)}</span></div></button>`;
}
function saveCard(s,o){
  o=o||{};
  const c=colOf(s.col),letter=(hostOf(s.url)[0]||'?').toUpperCase();
  const sl=o.sel;const on=sl&&sl.has(s.id);
  return `<button class="save ${on?'sel':''}" data-act="${sl?'sel-toggle':'open-save'}" data-id="${s.id}">${sl?`<span class="selmark">${on?ic('check',16,3.4):''}</span>`:''}
   <div class="thumb ${metaBusy.has(s.id)?'ld':''}"><span class="letter">${esc(letter)}</span>${s.image?`<img src="${esc(s.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
    ${o.badge?`<span class="badge" style="--c:${c.color};--bc:${inkOn(c.color)}">${esc(c.name)}</span>`:''}${s.pinned?`<span class="pinmark">${ic('thumbtack',15,2.6)}</span>`:''}</div>
   <div class="sb"><b>${esc(s.title)}</b><div class="src">${favImg(s)}<span>${esc(s.site||siteName(hostOf(s.url)))}</span></div></div></button>`;
}

/* ----- search ----- */
function stats(){const tags={};db.saves.forEach(s=>(s.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1));
  return{cols:db.cols.length,saves:db.saves.length,pinned:db.saves.filter(s=>s.pinned).length,tags:Object.keys(tags).length,tagMap:tags}}
const rowCol=c=>`<button class="row-i" data-act="open-col" data-id="${c.id}"><span class="cico" style="--c:${c.color};color:${inkOn(c.color)}">${ic(c.icon,22)}</span><span><b>${esc(c.name)}</b><small>${countOf(c.id)} ${countOf(c.id)===1?'item':'items'}</small></span></button>`;
const grid=list=>`<div class="grid">${list.map(s=>saveCard(s,{badge:true})).join('')}</div>`;
function searchBody(){
  const k=S.q.trim().toLowerCase(),st=stats();
  const byNew=db.saves.slice().sort((a,b)=>b.created-a.created);
  if(k){
    const cols=db.cols.filter(c=>c.name.toLowerCase().includes(k));
    const list=byNew.filter(s=>(s.title+' '+s.url+' '+(s.notes||'')+' '+(s.desc||'')+' '+(s.tags||[]).join(' ')).toLowerCase().includes(k));
    if(!cols.length&&!list.length)return `<div class="ph">${ic('search',56,2)}Tidak ada yang cocok.</div>`;
    return (cols.length?`<div class="sec2">Collections</div><div class="rows" style="margin-top:0">${cols.map(rowCol).join('')}</div>`:'')+(list.length?`<div class="sec2">Saves</div>${grid(list)}`:'');
  }
  if(S.tab==='cols')return `<div class="rows">${db.cols.map(rowCol).join('')}</div>`;
  if(S.tab==='saves'){
    const imgs=byNew.filter(isImg),links=byNew.filter(s=>!isImg(s));
    const uns=byNew.filter(x=>x.seen===false);const list=S.kind==='image'?imgs:S.kind==='link'?links:S.kind==='unseen'?uns:byNew;
    return `<div class="kinds"><button class="kind ${S.kind==='all'?'on':''}" data-act="kind" data-v="all">All ${byNew.length}</button><button class="kind ${S.kind==='link'?'on':''}" data-act="kind" data-v="link">${ic('link',18)} Links ${links.length}</button><button class="kind ${S.kind==='image'?'on':''}" data-act="kind" data-v="image">${ic('image',18)} Images ${imgs.length}</button>${uns.length||S.kind==='unseen'?`<button class="kind ${S.kind==='unseen'?'on':''}" data-act="kind" data-v="unseen">${ic('bell',18)} Unseen ${uns.length}</button>`:''}</div>`+(list.length?grid(list):`<div class="ph">Belum ada item.</div>`);
  }
  if(S.tab==='pinned'){const l=byNew.filter(s=>s.pinned);return `<div style="margin-top:26px"></div>`+(l.length?grid(l):`<div class="ph">${ic('thumbtack',52,2)}Belum ada yang disematkan.</div>`)}
  if(S.tab==='tags'){
    if(S.tag){const l=byNew.filter(s=>(s.tags||[]).includes(S.tag));return `<div class="kinds"><button class="kind on" data-act="tag-clear">${ic('tag',18)} ${esc(S.tag)} ${ic('x',16,2.6)}</button></div>`+grid(l)}
    const names=Object.keys(st.tagMap).sort((a,b)=>st.tagMap[b]-st.tagMap[a]||a.localeCompare(b));
    return names.length?`<div class="rows">${names.map(t=>`<button class="row-i" data-act="tag-pick" data-tag="${esc(t)}"><span class="cico" style="--c:var(--lime)">${ic('tag',22)}</span><span><b>${esc(t)}</b><small>${st.tagMap[t]} ${st.tagMap[t]===1?'save':'saves'}</small></span></button>`).join('')}</div>`:`<div class="ph">${ic('tag',52,2)}Belum ada tag.<br><span style="font-size:16px;font-weight:500">Tambahkan lewat halaman detail link.</span></div>`;
  }
  const rec=byNew.slice(0,10);
  return (rec.length?`<div class="sec2">${ic('clock',24,2.4)} Recently saved</div><div class="rail">${rec.map(s=>saveCard(s,{badge:true})).join('')}</div>`:'')+`<div class="ph">${ic('search',64,2)}Type something to search…</div>`;
}

  const tabs=[['cols','folder','Collections',st.cols],['saves','book','Saves',st.saves],['pinned','thumbtack','Pinned',st.pinned],['tags','tag','Tags',st.tags]];
  return `<div class="bar"><label class="sin">${ic('search',24)}<input id="sq" type="search" placeholder="Find collections or saves…" value="${esc(S.q)}" autocomplete="off"></label>
   <button class="cancel" data-act="back">Cancel</button></div>

async function cloudSave(){
  db.settings.lastSync=Date.now();save();
  const json=JSON.stringify(db,null,2);
  try{
    const f=new File([json],'bunki-sync.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Bunki sync'});toast('Terkirim');render();renderSheet();return}
  }catch(err){if(err&&err.name==='AbortError')return}
  download('bunki-sync.json',json);toast('File diunduh, simpan ke cloud kamu');renderSheet();
}
function mergeDb(x){
  let c=0,l=0;const ids=new Set(db.cols.map(k=>k.id)),sids=new Set(db.saves.map(k=>k.id)),urls=new Set(db.saves.map(k=>k.col+'|'+k.url));
  x.cols.forEach(k=>{if(!ids.has(k.id)){if(OLDMAP[k.color])k.color=OLDMAP[k.color];db.cols.push(k);c++}});
  x.saves.forEach(k=>{if(!sids.has(k.id)&&!urls.has(k.col+'|'+k.url)){if(!db.cols.find(q=>q.id===k.col))k.col='unsorted';db.saves.push(k);l++}});
  db.settings.lastSync=Date.now();save();return{c,l};
}

let press=null,lpTimer=0,lpStart=null,suppress=false;
function openPress(id,el){
  const r=el.getBoundingClientRect();
  press={id,x:r.left,y:r.top,w:r.width,h:r.height,html:el.outerHTML};

function closePress(){press=null;renderPress()}
function renderPress(){
  const el=document.getElementById('press');
  if(!press){el.classList.remove('on');el.innerHTML='';return}
  const {x,y,w,h}=press,W=innerWidth,left=x+w/2<W/2;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  // three round buttons arc around the card's top corner (mirrored for the left column)
  const pos=left
    ?{share:[x+w-34,y-34],del:[x+w*0.42-32,y-62],edit:[x+w-4,y+66]}
    :{share:[x-30,y-34],del:[x+w*0.55-32,y-62],edit:[x-64,y+66]};
  const c=colOf(press.id);
  const btn=(k,ico,label)=>`<button class="pb ${k==='del'?'del':''}" data-act="press-${k}" aria-label="${label}" style="left:${clamp(pos[k][0],8,W-72)}px;top:${Math.max(pos[k][1],70)}px">${ic(ico,28,2.4)}</button>`;
  el.innerHTML=`<div data-act="press-close" style="position:absolute;inset:0"></div>`+
    press.html.replace('<button class="col"',`<button class="col" tabindex="-1" style="left:${x}px;top:${y}px;width:${w}px;--c:${c.color}"`)+
    btn('share','share','Share')+(press.id!=='unsorted'?btn('del','trash','Delete'):'')+btn('edit','pencil','Edit');
  el.classList.add('on');
}

function importBookmarks(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const have=new Set(db.saves.map(x=>x.url));
  const generic=/^(bookmarks?( bar| menu| toolbar)?|other bookmarks|bookmark bar|favou?rites( bar)?|mobile bookmarks|unsorted)$/i;
  let added=0,newCols=0,ci=0;
  doc.querySelectorAll('a[href]').forEach(a=>{
    if(added>=2000)return;
    const raw=(a.getAttribute('href')||'').trim();if(!/^https?:\/\//i.test(raw))return;
    const url=normUrl(raw);if(!url||have.has(url))return;
    let name='';const dl=a.closest('dl');
    if(dl){const prev=dl.previousElementSibling,h=(prev&&prev.tagName==='H3')?prev:(dl.parentElement&&[...dl.parentElement.children].find(x=>x.tagName==='H3'));if(h)name=h.textContent.trim()}
    let col='unsorted';
    if(name&&!generic.test(name)){
      let c=db.cols.find(x=>x.name.toLowerCase()===name.toLowerCase());
      if(!c){c={id:uid(),name:name.slice(0,40),color:COLORS[(db.cols.length+ci++)%COLORS.length],icon:'folder'};db.cols.push(c);newCols++}
      col=c.id;
    }
    const h=hostOf(url);
    db.saves.push({id:uid(),url,title:(a.textContent.trim()||h).slice(0,150),titleEdited:true,desc:'',image:ytThumb(url),logo:'',site:siteName(h),col,notes:'',tags:[],pinned:false,seen:true,created:Date.now()-(added++)});
    have.add(url);
  });
  save();return{added,newCols};
}

document.addEventListener('click',async e=>{
  if(e.target.id==='sheet'){return closeSheet()}

  const d=b.dataset,act=d.act;buzz(8);

    case 'ovw': S.tab=null;S.q='';S.tag=null;render();kick();break;

    case 'tag-clear': S.tag=null;render();break;

    case 'press-share':{const id=press.id;closePress();shareCollection(id);break}

    case 'press-del':{const c=colOf(press.id);closePress();
      confirmAsk({title:`Hapus "${c.name}"?`,text:'Link di dalamnya dipindah ke Unsorted.',ok:'Hapus',cb:()=>{db.saves.forEach(s=>{if(s.col===c.id)s.col='unsorted'});db.cols.forEach(x=>{if(x.parent===c.id)delete x.parent});db.cols=db.cols.filter(x=>x.id!==c.id);save();closeSheet();render();toast('Koleksi dihapus')}});break}
    case 'back': back();break;
    case 'search': Object.assign(S,{q:'',tab:null,kind:'all',tag:null});go({name:'search'});document.getElementById('sq')?.focus();break;
    case 'settings': go({name:'settings'});break;
    case 'backup': openSheet({type:'backup'});break;
    case 'howto': openSheet({type:'howto'});break;
    case 'privacy': openSheet({type:'privacy'});break;
    case 'toggle': db.settings[d.k]=!db.settings[d.k];save();render();buzz(15);break;
    case 'seeall': Object.assign(S,{q:'',tab:'cols',kind:'all',tag:null});go({name:'search'});break;
    case 'unseen': Object.assign(S,{q:'',tab:'saves',kind:'unseen',tag:null});go({name:'search'});break;
    case 'manage': openSheet({type:'manage'});break;
    case 'close': closeSheet();break;
    case 'paste':
      try{const t=await navigator.clipboard.readText();if(t){quick=t.trim();const i=document.getElementById('quick');if(i)i.value=quick}}
      catch(err){toast('Tidak bisa membaca clipboard, tempel manual');document.getElementById('quick')?.focus()}
      break;
    case 'add-link':
      ask({title:'Tambah link',placeholder:'https://…',inputmode:'url',ok:'Simpan',cb:v=>{const u=normUrl(v);if(!u)return toast('Link tidak valid');closeSheet();if(dupOf(u))return dupToast(u);addSave(u,view.id);toast('Link tersimpan')}});
      break;
    case 'open-save':{const sv=saveOf(d.id);if(sv&&sv.seen===false){sv.seen=true;save()}go({name:'save',id:d.id});break}
    case 'edit-title':
      ask({title:'Ubah judul',value:cur.title,placeholder:'Judul',ok:'Simpan',cb:v=>{if(!v)return;cur.title=v.slice(0,150);cur.titleEdited=true;save();closeSheet();render()}});
      break;
    case 'move': openSheet({type:'move',id:cur.id});break;
    case 'back-detail': closeSheet();break;
    case 'move-to': cur.col=d.id;save();closeSheet();render();toast('Dipindahkan ke '+colOf(d.id).name);break;
    case 'share':
      if(navigator.share){navigator.share({title:cur.title,url:cur.url}).catch(()=>{})}
      else{navigator.clipboard?.writeText(cur.url).then(()=>toast('Link disalin'),()=>toast('Gagal menyalin'))}
      break;
    case 'refresh':{
      toast('Mengambil info…');
      const sv=cur;sv.metaTried=0;const ok=await loadMeta(sv);
      toast(ok&&(sv.image||sv.desc)?'Diperbarui':'Tidak bisa mengambil info website');
      break}
    case 'delete':
      confirmAsk({title:'Hapus link ini?',text:cur.title,ok:'Hapus',cb:()=>{db.saves=db.saves.filter(s=>s.id!==cur.id);save();closeSheet();back();toast('Link dihapus')}});
      break;
    case 'add-tag':
      ask({title:'Tambah tag',placeholder:'mis. desain',ok:'Tambah',cb:v=>{v=v.replace(/^#/,'').slice(0,24);if(v&&!(cur.tags||[]).includes(v)){cur.tags=[...(cur.tags||[]),v];save()}closeSheet();render()}});
      break;
    case 'rm-tag': cur.tags=(cur.tags||[]).filter(t=>t!==d.tag);save();render();break;
    case 'confirm-ok':{const snap=JSON.stringify(db),fn=sheet.cb;fn();
      if(JSON.stringify(db)!==snap)toastAct(lastMsg||'Dihapus','Urungkan',()=>{db=JSON.parse(snap);save();sel=null;render();toast('Dikembalikan')});
      break}
    case 'toast-act':{const f=toastFn;toastFn=null;document.getElementById('toast').classList.remove('on','act');if(f)f();break}
    case 'col-new': openSheet({type:'colform',id:null,draft:{name:'',color:COLORS[0],icon:'folder'}});break;
    case 'col-menu': openSheet({type:'colmenu',id:d.id});break;
    case 'select-links': sheet=null;sel=new Set();render();break;
    case 'sel-cancel': sel=null;render();break;
    case 'sel-all':{const ids=db.saves.filter(x=>x.col===view.id).map(x=>x.id);if(sel.size===ids.length)sel.clear();else ids.forEach(i=>sel.add(i));render();break}
    case 'sel-toggle': if(sel){sel.has(d.id)?sel.delete(d.id):sel.add(d.id);buzz(10);render()}break;
    case 'sel-move': if(!sel||!sel.size)return toast('Pilih link dulu');openSheet({type:'movesel'});break;

    case 'sel-pin':{if(!sel||!sel.size)return toast('Pilih link dulu');const items=db.saves.filter(x=>sel.has(x.id));const all=items.every(x=>x.pinned);items.forEach(x=>x.pinned=!all);save();toast(all?'Sematan dilepas':'Disematkan');sel=null;render();break}
    case 'sel-del':{if(!sel||!sel.size)return toast('Pilih link dulu');const n=sel.size;confirmAsk({title:`Hapus ${n} link?`,text:'Link yang dipilih akan dihapus permanen.',ok:'Hapus',cb:()=>{db.saves=db.saves.filter(x=>!sel.has(x.id));save();sel=null;closeSheet();render();toast(n+' link dihapus')}});break}
    case 'sub-col': openSheet({type:'colform',id:null,parent:view.id,draft:{name:'',color:COLORS[(db.cols.length)%COLORS.length],icon:'folder'}});break;
    case 'cloud': openSheet({type:'cloud'});break;
    case 'cloud-save':await cloudSave();break;
    case 'share-col': closeSheet();shareCollection(view.id);break;
    case 'col-edit':{const c=colOf(d.id);openSheet({type:'colform',id:c.id,draft:{name:c.name,color:c.color,icon:c.icon}});break}
    case 'pick-color': sheet.draft.color=d.v;paintForm();break;
    case 'pick-icon': sheet.draft.icon=d.v;paintForm();break;
    case 'col-del':{
      const c=colOf(sheet.id);
      confirmAsk({title:`Hapus "${c.name}"?`,text:'Link di dalamnya dipindah ke Unsorted.',ok:'Hapus',cb:()=>{db.saves.forEach(s=>{if(s.col===c.id)s.col='unsorted'});db.cols.forEach(x=>{if(x.parent===c.id)delete x.parent});db.cols=db.cols.filter(x=>x.id!==c.id);save();if(view.name==='col'&&view.id===c.id)view={name:'home'};closeSheet();render();toast('Koleksi dihapus')}});
      break}
    case 'export': download('bunki-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2));break;
    case 'reset':
      confirmAsk({title:'Hapus semua data?',text:'Semua link dan koleksi akan hilang dari browser ini. Tidak bisa dibatalkan.',ok:'Hapus semua',cb:()=>{db=seed();save();view={name:'home'};closeSheet();render();toast('Data direset')}});
      break;
  }
});

function handleSubmit(el){
  const f=el&&el.dataset.form;if(!f)return;
  if(f==='quick'){
    const u=normUrl(document.getElementById('quick').value);
    if(!u)return toast('Tempel link yang valid dulu');
    if(dupOf(u))return dupToast(u);quick='';addSave(u,'unsorted');toast('Disimpan ke Unsorted');
  }
  if(f==='input'){sheet.cb(el.querySelector('[name=v]').value.trim())}
  if(f==='colform'){
    const name=el.querySelector('[name=name]').value.trim();if(!name)return toast('Nama koleksi wajib diisi');
    const dr=sheet.draft;
    if(sheet.id){const c=colOf(sheet.id);Object.assign(c,{name:name.slice(0,40),color:dr.color,icon:dr.icon})}
    else{const nc={id:uid(),name:name.slice(0,40),color:dr.color,icon:dr.icon};if(sheet.parent)nc.parent=sheet.parent;db.cols.push(nc)}
    save();closeSheet();render();toast('Koleksi tersimpan');
  }
}

document.addEventListener('change',async e=>{
  if(e.target.id==='impb'){

  }

      const r=mergeDb(x);closeSheet();render();ensureMeta(visibleSaves());toast(r.l||r.c?`${r.l} link, ${r.c} koleksi digabung`:'Sudah sinkron, tidak ada yang baru')}
    catch(err){toast('File sync tidak valid')}
    e.target.value='';return;
  }
  if(e.target.id==='imp'){
    const f=e.target.files[0];if(!f)return;
    try{const s=JSON.parse(await f.text());if(!Array.isArray(s.cols)||!Array.isArray(s.saves))throw 0;
      if(!s.cols.find(c=>c.id==='unsorted'))s.cols.unshift({id:'unsorted',name:'Unsorted',color:'#a8a8a8',icon:'folder'});
      s.cols.forEach(c=>{if(OLDMAP[c.color])c.color=OLDMAP[c.color]});
      s.settings=Object.assign({haptic:true,remind:true},s.settings||{});db=s;save();view={name:'home'};stack.length=0;closeSheet();render();toast('Impor berhasil')}
    catch(err){toast('File tidak valid')}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(press)closePress();else if(sheet)closeSheet()}});
/* error handler for broken images in thumbnails already handled inline */
render();kick();
/* Share target: links shared from other apps arrive as ?url= / ?text= */
(function(){try{
  const q=new URLSearchParams(location.search);if(!(q.has('url')||q.has('text')||q.has('title')))return;
  const m=[q.get('url'),q.get('text'),q.get('title')].filter(Boolean).join(' ').match(/https?:\/\/[^\s]+/i);
  history.replaceState(null,'',location.pathname);
  const u=m&&normUrl(m[0].replace(/[)\].,;]+$/,''));
  if(!u)return toast('Tidak ada link di yang dibagikan');
  if(dupOf(u))return dupToast(u);
  addSave(u,'unsorted');toast('Disimpan ke Unsorted');
}catch(e){}})();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
